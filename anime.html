<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AORI-ANIME</title>
<link rel="stylesheet" href="styles.css">
<style>
.detail{max-width:1160px;margin:auto;padding:38px 24px 70px}
.back{color:#93bbff;text-decoration:none;font-weight:800}
.detail-grid{display:grid;grid-template-columns:270px 1fr;gap:38px;margin-top:30px}
.detail-grid img{width:100%;border-radius:18px;border:1px solid var(--line)}
.detail-grid h1{font-size:clamp(36px,6vw,66px);margin:8px 0 14px}
.desc{color:var(--muted);line-height:1.8;font-size:16px}
.player,.watch-options{margin-top:38px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#081329}
.player-head,.watch-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.player-controls{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:#09142a}
.player-controls label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.player-controls select{background:#0b1730;color:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none}
.video{aspect-ratio:16/9;background:#020611;display:grid;place-items:center}
.video video{width:100%;height:100%;display:block;background:#000}
.watch-empty{padding:34px 24px;color:var(--muted);line-height:1.7}
.watch-empty b{display:block;color:#fff;font-size:20px;margin-bottom:8px}
.watch-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;padding:20px}
.watch-card{display:flex;gap:13px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:#09142a;text-decoration:none;color:#fff;transition:.18s transform,.18s border-color}
.watch-card:hover{transform:translateY(-2px);border-color:#6fa0ff}
.watch-card img{width:44px;height:44px;object-fit:cover;border-radius:10px;background:#0b1730}
.watch-card .fallback-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:#10203f;color:#93bbff;font-size:20px;flex:none}
.watch-card strong{display:block;font-size:15px;line-height:1.35}.watch-card span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.episode-list{max-height:430px;overflow:auto}
.note{font-size:13px;color:var(--muted);padding:0 20px 16px;margin:0}
.community-watch{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.community-watch a{padding:12px 15px;border-radius:11px;color:white;text-decoration:none;font-weight:850;border:1px solid var(--line);background:#0b1730}
@media(max-width:720px){.detail-grid{grid-template-columns:1fr}.detail-grid img{max-width:240px}.detail{padding:25px 18px}.watch-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <a class="logo" href="./index.html">
    <img src="./aori-avatar.gif" alt="AORI-ANIME">
    <span>AORI-<b>ANIME</b></span>
  </a>
</header>

<main class="detail">
  <a class="back" href="./index.html">← Вернуться в каталог</a>
  <div id="detail" class="loading">Загрузка...</div>
</main>

<script src="./streams.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const API = 'https://graphql.anilist.co';
const query = `query($id:Int){
  Media(id:$id,type:ANIME){
    title{romaji english native}
    coverImage{large}
    description(asHtml:false)
    genres
    seasonYear
    episodes
    averageScore
    streamingEpisodes{title thumbnail url site}
    externalLinks{url site type language color icon isDisabled}
  }
}`;

const esc = s => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };
function getTitle(a){ return a.title.english || a.title.romaji || a.title.native || 'Без названия'; }
function safeUrl(url){ try{ const u=new URL(url); return /^https?:$/.test(u.protocol) ? u.href : ''; }catch{return '';} }

function directPlayerHtml(streamData){
  if(!streamData || !Array.isArray(streamData.episodes) || !streamData.episodes.length) return '';
  const eps=streamData.episodes;
  return `
    <section class="player" id="playerBox">
      <div class="player-head"><b>▶ Смотреть на AORI-ANIME</b><span class="meta">Подключённый разрешённый источник</span></div>
      <div class="player-controls">
        <label>Серия <select id="episodeSelect">${eps.map((e,i)=>`<option value="${i}">${esc(e.title || ('Серия '+e.number))}</option>`).join('')}</select></label>
        <label>Озвучка / дорожка <select id="audioSelect"></select></label>
      </div>
      <div class="video"><video id="animeVideo" controls playsinline preload="metadata"></video></div>
      <p class="note">Воспроизведение идёт прямо на странице AORI-ANIME.</p>
    </section>`;
}

function setupDirectPlayer(streamData){
  if(!streamData || !streamData.episodes || !streamData.episodes.length) return;
  const episodeSelect=document.getElementById('episodeSelect');
  const audioSelect=document.getElementById('audioSelect');
  const video=document.getElementById('animeVideo');
  if(!episodeSelect||!audioSelect||!video) return;
  function fillAudio(){
    const episode=streamData.episodes[Number(episodeSelect.value)];
    const tracks=episode.audio||[];
    audioSelect.innerHTML=tracks.map((track,i)=>`<option value="${i}">${esc(track.name||('Дорожка '+(i+1)))}</option>`).join('');
    loadTrack();
  }
  function loadTrack(){
    const episode=streamData.episodes[Number(episodeSelect.value)];
    const track=(episode.audio||[])[Number(audioSelect.value)];
    if(!track || !safeUrl(track.src)) return;
    video.pause(); video.innerHTML='';
    const source=document.createElement('source'); source.src=track.src; source.type=track.type||'';
    video.appendChild(source); video.load();
  }
  episodeSelect.addEventListener('change',fillAudio);
  audioSelect.addEventListener('change',loadTrack);
  fillAudio();
}

function watchOptionsHtml(a){
  const episodes=(a.streamingEpisodes||[]).filter(x=>safeUrl(x.url));
  const links=(a.externalLinks||[]).filter(x=>!x.isDisabled && safeUrl(x.url));
  if(!episodes.length && !links.length){
    return `<section class="watch-options"><div class="watch-head"><b>◉ Где посмотреть легально</b></div><div class="watch-empty"><b>Пока нет доступных ссылок</b>Для этого аниме AniList сейчас не вернул ссылки на легальные эпизоды или внешние сервисы. Когда такие ссылки появятся в данных AniList, эта страница покажет их автоматически.</div></section>`;
  }
  const episodeCards=episodes.map(ep=>{
    const icon=safeUrl(ep.thumbnail) ? `<img src="${esc(safeUrl(ep.thumbnail))}" alt="">` : `<div class="fallback-icon">▶</div>`;
    return `<a class="watch-card" href="${esc(safeUrl(ep.url))}" target="_blank" rel="noopener noreferrer">${icon}<div><strong>${esc(ep.title||'Открыть эпизод')}</strong><span>${esc(ep.site||'Легальный источник')} · Открыть просмотр</span></div></a>`;
  }).join('');
  const linkCards=links.map(link=>{
    const icon=safeUrl(link.icon) ? `<img src="${esc(safeUrl(link.icon))}" alt="">` : `<div class="fallback-icon">↗</div>`;
    const lang=link.language ? ` · ${esc(link.language)}` : '';
    return `<a class="watch-card" href="${esc(safeUrl(link.url))}" target="_blank" rel="noopener noreferrer">${icon}<div><strong>${esc(link.site||'Открыть сервис')}</strong><span>Внешний сервис${lang}</span></div></a>`;
  }).join('');
  return `
    ${episodes.length ? `<section class="watch-options"><div class="watch-head"><b>▶ Доступные легальные эпизоды</b><span class="meta">${episodes.length} вариантов</span></div><div class="watch-list episode-list">${episodeCards}</div></section>` : ''}
    ${links.length ? `<section class="watch-options"><div class="watch-head"><b>◉ Доступные сервисы</b><span class="meta">Ссылки из AniList</span></div><div class="watch-list">${linkCards}</div></section>` : ''}`;
}

if(!id || !Number(id)){
  document.getElementById('detail').innerHTML='<div class="loading">Не указан идентификатор аниме.</div>';
}else{
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables:{id:Number(id)}})})
  .then(r=>{if(!r.ok) throw Error('Ошибка сети: '+r.status); return r.json();})
  .then(j=>{
    if(j.errors) throw Error(j.errors[0].message);
    const a=j.data.Media, t=getTitle(a);
    document.title=t+' — AORI-ANIME';
    const streamData=(window.AORI_STREAMS||{})[String(id)] || (window.AORI_STREAMS||{})[Number(id)];
    document.getElementById('detail').innerHTML=`
      <section class="detail-grid">
        <img src="${esc(a.coverImage.large||'')}" alt="${esc(t)}">
        <div>
          <p class="eyebrow">AORI-ANIME • СТРАНИЦА АНИМЕ</p>
          <h1>${esc(t)}</h1>
          <p class="meta">${a.seasonYear||'—'} · ${a.episodes||'—'} эп. · ★ ${a.averageScore?(a.averageScore/10).toFixed(1):'—'}</p>
          <div class="tags">${(a.genres||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>
          <p class="desc">${esc((a.description||'Описание отсутствует.').replace(/<[^>]*>/g,''))}</p>
        </div>
      </section>
      ${directPlayerHtml(streamData)}
      ${watchOptionsHtml(a)}
      <div class="community-watch">
        <a class="discord" href="https://discord.gg/aori" target="_blank" rel="noopener">⌁ Зайти на Discord сервер</a>
        <a class="telegram" href="https://t.me/dscaori" target="_blank" rel="noopener">➤ Наш Telegram</a>
      </div>`;
    setupDirectPlayer(streamData);
  })
  .catch(e=>{document.getElementById('detail').innerHTML=`<div class="loading">Ошибка загрузки: ${esc(e.message)}</div>`;});
}
</script>
</body>
</html>
