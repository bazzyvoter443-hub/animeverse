<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AORI-ANIME</title>
<link rel="stylesheet" href="styles.css">
<style>
.detail{max-width:1160px;margin:auto;padding:38px 24px 70px}
.back{color:#93bbff;text-decoration:none;font-weight:800}
.detail-grid{display:grid;grid-template-columns:270px 1fr;gap:38px;margin-top:30px}
.detail-grid img{width:100%;border-radius:18px;border:1px solid var(--line)}
.detail-grid h1{font-size:clamp(36px,6vw,66px);margin:8px 0 14px}
.desc{color:var(--muted);line-height:1.8;font-size:16px}
.player{margin-top:38px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#081329}
.player-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.player-controls{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:#09142a}
.player-controls label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.player-controls select{background:#0b1730;color:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none}
.video{aspect-ratio:16/9;background:#020611;display:grid;place-items:center}
.video video{width:100%;height:100%;display:block;background:#000}
.novideo{height:100%;min-height:340px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.novideo h3{color:#fff;margin:0 0 10px}
.novideo code{display:inline-block;background:#0b1730;border:1px solid var(--line);padding:3px 7px;border-radius:7px;color:#93bbff}
.community-watch{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.community-watch a{padding:12px 15px;border-radius:11px;color:white;text-decoration:none;font-weight:850;border:1px solid var(--line);background:#0b1730}
.note{font-size:13px;color:var(--muted);padding:0 20px 16px;margin:0}
@media(max-width:720px){.detail-grid{grid-template-columns:1fr}.detail-grid img{max-width:240px}.detail{padding:25px 18px}}
</style>
</head>
<body>
<header class="header">
  <a class="logo" href="./index.html">
    <img src="./aori-avatar.gif" alt="AORI-ANIME">
    <span>AORI-<b>ANIME</b></span>
  </a>
</header>

<main class="detail">
  <a class="back" href="./index.html">← Вернуться в каталог</a>
  <div id="detail" class="loading">Загрузка...</div>
</main>

<script src="./streams.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const API = 'https://graphql.anilist.co';
const query = `query($id:Int){
  Media(id:$id,type:ANIME){
    title{romaji english native}
    coverImage{large}
    description(asHtml:false)
    genres
    seasonYear
    episodes
    averageScore
  }
}`;

const esc = s => {
  const d=document.createElement('div');
  d.textContent=s||'';
  return d.innerHTML;
};

function getTitle(a){
  return a.title.english || a.title.romaji || a.title.native || 'Без названия';
}

function playerHtml(streamData){
  if(!streamData || !Array.isArray(streamData.episodes) || !streamData.episodes.length){
    return `
      <section class="player">
        <div class="player-head">
          <b>▶ Прямой просмотр</b>
          <span class="meta">Источник пока не подключён</span>
        </div>
        <div class="video">
          <div class="novideo">
            <div>
              <h3>Для этого аниме пока нет подключённого источника</h3>
              <p>На этой странице используется только встроенный плеер; трейлеры и автоматические переходы отключены.</p>
              <p>Прямой просмотр появится автоматически, когда для этого ID будет добавлен разрешённый источник в <code>streams.js</code>.</p>
            </div>
          </div>
        </div>
      </section>`;
  }

  const eps = streamData.episodes;
  const first = eps[0];
  const audio = first.audio || [];
  if(!audio.length){
    return `<section class="player"><div class="novideo">Для выбранной серии нет подключённых дорожек.</div></section>`;
  }

  return `
    <section class="player" id="playerBox">
      <div class="player-head">
        <b>▶ Прямой просмотр</b>
        <span class="meta">Воспроизведение на AORI-ANIME</span>
      </div>
      <div class="player-controls">
        <label>Серия
          <select id="episodeSelect">
            ${eps.map((e,i)=>`<option value="${i}">${esc(e.title || ('Серия '+e.number))}</option>`).join('')}
          </select>
        </label>
        <label>Озвучка / дорожка
          <select id="audioSelect"></select>
        </label>
      </div>
      <div class="video">
        <video id="animeVideo" controls playsinline preload="metadata"></video>
      </div>
      <p class="note">Видео воспроизводится прямо на странице. Источники добавляются владельцем сайта в конфигурацию разрешённых видеопотоков.</p>
    </section>`;
}

function setupPlayer(streamData){
  if(!streamData || !streamData.episodes || !streamData.episodes.length) return;

  const episodeSelect = document.getElementById('episodeSelect');
  const audioSelect = document.getElementById('audioSelect');
  const video = document.getElementById('animeVideo');

  function fillAudio(){
    const episode = streamData.episodes[Number(episodeSelect.value)];
    const tracks = episode.audio || [];
    audioSelect.innerHTML = tracks.map((track,i)=>`<option value="${i}">${esc(track.name || ('Дорожка '+(i+1)))}</option>`).join('');
    loadTrack();
  }

  function loadTrack(){
    const episode = streamData.episodes[Number(episodeSelect.value)];
    const track = (episode.audio || [])[Number(audioSelect.value)];
    if(!track) return;

    video.pause();
    video.removeAttribute('src');
    video.innerHTML='';

    // Обычные MP4/WebM воспроизводятся встроенным HTML5-плеером.
    // Для HLS .m3u8 нужен браузер с нативной поддержкой HLS или отдельный разрешённый HLS-плеер.
    const source=document.createElement('source');
    source.src=track.src;
    source.type=track.type || '';
    video.appendChild(source);
    video.load();
  }

  episodeSelect.addEventListener('change', fillAudio);
  audioSelect.addEventListener('change', loadTrack);
  fillAudio();
}

if(!id || !Number(id)){
  document.getElementById('detail').innerHTML='<div class="loading">Не указан идентификатор аниме.</div>';
} else {
  fetch(API,{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({query,variables:{id:Number(id)}})
  })
  .then(r=>{
    if(!r.ok) throw Error('Ошибка сети: '+r.status);
    return r.json();
  })
  .then(j=>{
    if(j.errors) throw Error(j.errors[0].message);
    const a=j.data.Media;
    const t=getTitle(a);
    document.title=t+' — AORI-ANIME';

    const localStreamData=(window.AORI_STREAMS||{})[String(id)] || (window.AORI_STREAMS||{})[Number(id)];

    document.getElementById('detail').innerHTML=`
      <section class="detail-grid">
        <img src="${a.coverImage.large||''}" alt="${esc(t)}">
        <div>
          <p class="eyebrow">AORI-ANIME • СТРАНИЦА АНИМЕ</p>
          <h1>${esc(t)}</h1>
          <p class="meta">${a.seasonYear||'—'} · ${a.episodes||'—'} эп. · ★ ${a.averageScore?(a.averageScore/10).toFixed(1):'—'}</p>
          <div class="tags">${(a.genres||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div>
          <p class="desc">${esc((a.description||'Описание отсутствует.').replace(/<[^>]*>/g,''))}</p>
        </div>
      </section>
      ${playerHtml(localStreamData)}
      <div class="community-watch">
        <a class="discord" href="https://discord.gg/aori" target="_blank" rel="noopener">⌁ Зайти на Discord сервер</a>
        <a class="telegram" href="https://t.me/dscaori" target="_blank" rel="noopener">➤ Наш Telegram</a>
      </div>`;
    setupPlayer(localStreamData);
  })
  .catch(e=>{
    document.getElementById('detail').innerHTML=`<div class="loading">Ошибка загрузки: ${esc(e.message)}</div>`;
  });
}
</script>
</body>
</html>
