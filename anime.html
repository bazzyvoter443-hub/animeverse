<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AORI-ANIME</title>
<link rel="stylesheet" href="styles.css">
<style>
.detail-wrap{max-width:1180px;margin:auto;padding:42px 22px 70px}
.back{color:#86b6ff;text-decoration:none;font-weight:800}
.detail-hero{display:grid;grid-template-columns:260px 1fr;gap:36px;margin-top:30px;align-items:start}
.detail-poster{width:100%;border-radius:20px;border:1px solid var(--line);box-shadow:0 20px 55px #0008}
.detail-title{font-size:clamp(34px,6vw,68px);line-height:1;margin:8px 0 16px}
.detail-desc{color:var(--muted);line-height:1.8;font-size:16px}
.player-box{margin-top:36px;border:1px solid var(--line);background:#07152d;border-radius:18px;overflow:hidden}
.player-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.player-head b{font-size:16px}.player-note{font-size:12px;color:var(--muted)}
.video{aspect-ratio:16/9;background:#020713;display:grid;place-items:center}
.video iframe{width:100%;height:100%;border:0}
.no-video{text-align:center;padding:50px 20px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.action{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:11px;text-decoration:none;color:#fff;background:#0d2142;border:1px solid var(--line);font-weight:800}
.action.primary{background:linear-gradient(135deg,#286cff,#5c9cff);border:0}
.watch-community{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.watch-community a{padding:10px 13px;border-radius:10px;text-decoration:none;color:#fff;font-weight:800;border:1px solid var(--line)}
.watch-community .discord{background:#5865f218}.watch-community .telegram{background:#229ed918}
@media(max-width:720px){.detail-hero{grid-template-columns:1fr}.detail-poster{max-width:240px}.detail-wrap{padding-top:28px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><img src="aori-avatar.gif" class="brand-avatar" alt="AORI-ANIME"><span>AORI-<b>ANIME</b></span></a>
</header>
<main class="detail-wrap">
  <a class="back" href="./">← Вернуться в каталог</a>
  <div id="detail" class="status">Загрузка страницы аниме…</div>
</main>
<script>
const id=new URLSearchParams(location.search).get("id");
const API="https://graphql.anilist.co";
const query=`query($id:Int){Media(id:$id,type:ANIME){title{romaji english native}coverImage{large}description(asHtml:false)genres seasonYear episodes averageScore siteUrl trailer{id site thumbnail}}}`;
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML};
fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({query,variables:{id:Number(id)}})})
.then(r=>r.json()).then(j=>{
 if(j.errors)throw Error(j.errors[0].message);
 const a=j.data.Media,t=a.title.english||a.title.romaji||a.title.native;
 document.title=t+" — AORI-ANIME";
 const trailer=a.trailer&&a.trailer.site==="youtube"&&a.trailer.id;
 const player=trailer
 ? `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(a.trailer.id)}?rel=0" title="Официальный трейлер ${esc(t)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
 : `<div class="no-video"><h3>Трейлер пока не найден</h3><p>Для этого тайтла AniList не вернул официальный YouTube-трейлер.</p></div>`;
 document.querySelector("#detail").innerHTML=`
 <section class="detail-hero">
   <img class="detail-poster" src="${a.coverImage.large||""}" alt="${esc(t)}">
   <div>
     <p class="eyebrow">AORI-ANIME • СТРАНИЦА ТАЙТЛА</p>
     <h1 class="detail-title">${esc(t)}</h1>
     <p class="meta">${a.seasonYear||"—"} · ${a.episodes?a.episodes+" эп.":"Аниме"} · ★ ${a.averageScore?(a.averageScore/10).toFixed(1):"—"}</p>
     <div class="tags">${(a.genres||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
     <p class="detail-desc">${esc((a.description||"Описание отсутствует.").replace(/<[^>]*>/g,""))}</p>
     <div class="actions">
       <a class="action primary" href="${a.siteUrl}" target="_blank" rel="noopener">Открыть страницу AniList →</a>
       <a class="action" href="https://discord.gg/aori" target="_blank" rel="noopener">⌁ Наш Discord</a>
       <a class="action" href="https://t.me/dscaori" target="_blank" rel="noopener">✈ Наш Telegram</a>
     </div>
   </div>
 </section>
 <section class="player-box">
   <div class="player-head"><b>▶ Просмотр</b><span class="player-note">Официальный трейлер из метаданных AniList</span></div>
   <div class="video">${player}</div>
 </section>
 <div class="watch-community">
   <a class="discord" href="https://discord.gg/aori" target="_blank" rel="noopener">⌁ Заходите на наш Discord сервер</a>
   <a class="telegram" href="https://t.me/dscaori" target="_blank" rel="noopener">✈ Подписывайтесь на Telegram</a>
 </div>`;
}).catch(e=>document.querySelector("#detail").innerHTML=`<div class="status">Ошибка загрузки: ${esc(e.message)}</div>`);
</script>
</body></html>
