<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeVerse</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="logo" href="./">Anime<span>Verse</span></a></header><main style="padding-top:40px"><div id="detail" class="status">Загрузка…</div></main><script>
const id=new URLSearchParams(location.search).get("id"), API="https://graphql.anilist.co";
const q=`query($id:Int){Media(id:$id,type:ANIME){title{romaji english native}coverImage{large}bannerImage description(asHtml:false)averageScore episodes genres seasonYear status format siteUrl}}`;
fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,variables:{id:Number(id)}})}).then(r=>r.json()).then(j=>{const a=j.data.Media,t=a.title.english||a.title.romaji||a.title.native;document.title=t+" — AnimeVerse";detail.innerHTML=`<div style="display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:35px;align-items:start"><img style="width:100%;border-radius:16px" src="${a.coverImage.large}" alt=""><section><h1 style="font-size:clamp(30px,5vw,55px);margin-top:0">${t}</h1><p class="meta">${a.seasonYear||"—"} · ${a.format||"—"} · ${a.episodes?a.episodes+" эп.":"—"} · ★ ${a.averageScore?(a.averageScore/10).toFixed(1):"—"}</p><div class="tags">${a.genres.map(g=>`<span class="tag">${g}</span>`).join("")}</div><p style="line-height:1.7;margin-top:25px">${a.description||"Описание отсутствует."}</p><a href="${a.siteUrl}" target="_blank" rel="noopener" id="more">Открыть в AniList</a></section></div>`}).catch(e=>detail.textContent="Не удалось загрузить аниме.");
</script></body></html>
